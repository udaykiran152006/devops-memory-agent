name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: pipeline/sample-app
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest pipeline/sample-app -q
